<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title> 
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <main>
      <div class="container">
        <div id="container1">
            <input 
            id="usuario" 
            type="text" 
            placeholder="Nombre de usuario" 
            required
            >
            <button id="siguiente1">Siguiente</button>
            </div>
        <div id="container2" class="hidden">
            <input 
            id="correo"  
            type="email" 
            placeholder="Correo electrónico"
            required
            >
            <button id="siguiente2">Siguiente</button>
            </div>
        <div id="container3" class="hidden">
            <input 
            id="contraseña" 
            type="password" 
            placeholder="Introduce tu contraseña" 
            required
            >
            <button id="siguiente3">Siguiente</button>
            </div>
        <div id="container4" class="hidden"> 
            <p>
                Has llegado al final, a la página que lleva 1 hora sin salir, 
                la página perdida, antes pensada como una leyenda, hoy, la has encontardo.
            </p>
        </div>
    </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
